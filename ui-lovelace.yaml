title: Shayno 🤓
views:
  - title: Shayno 🤓
    path: sections-test
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: 'Good {{ states(''sensor.time_of_day'') }} Shayno '
            secondary: >-
              There{% if states('sensor.lights_on') | int == 0 or
              states('sensor.lights_on') | int > 1 %} are {{
              states('sensor.lights_on') }} lights {% elif
              states('sensor.lights_on') | int == 1 %} is 1 light {% endif %}on.

              And the garage door is {{states('cover.garage_door')}}
            icon: mdi:home-assistant
            multiline_secondary: true
            icon_color: green
            tap_action:
              action: navigate
              navigation_path: /config/devices/dashboard?historyBack=1&domain=zha
            picture: /local/shayno1.png
            fill_container: true
            layout: horizontal
          - square: false
            columns: 4
            type: grid
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.rainfall_today
                name: Rain
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/2
                icon_color: blue
                layout: vertical
                icon: mdi:weather-lightning-rainy
                fill_container: false
              - type: custom:mushroom-template-card
                entity: binary_sensor.bed_opening
                tap_action:
                  action: navigate
                  navigation_path: /config/devices/dashboard?historyBack=1&domain=zha
                layout: vertical
                secondary: '{{ states(''sensor.binary_sensor_bed_opening'') }}'
                icon: mdi:bed
                icon_color: purple
                primary: 'Bed '
                hold_action:
                  action: more-info
              - type: custom:mushroom-entity-card
                entity: sensor.front_door_battery
                name: Door
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      style: |
                        --popup-background-color: black;
                        --popup-border-color: transparent;
                      title: Front Door
                      content:
                        type: custom:mod-card
                        style: |
                          ha-card {
                             padding-right: 15px;
                             padding-left: 15px;
                             padding-bottom: 15px;     
                          }
                        card:
                          type: vertical-stack
                          cards:
                            - show_state: false
                              show_name: false
                              camera_view: live
                              type: picture-entity
                              entity: camera.front_door
                            - type: entities
                              entities:
                                - entity: binary_sensor.front_door_motion_2
                                - entity: sensor.front_door_battery
                              title: Front Door
                              state_color: false
                layout: vertical
                icon_color: deep-orange
              - type: custom:mushroom-entity-card
                entity: sensor.to_work
                name: Work
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      style: |
                        --popup-background-color: black;
                        --popup-border-color: transparent;
                      title: Work
                      content:
                        type: custom:mod-card
                        style: |
                          ha-card {
                             padding-right: 15px;
                             padding-left: 15px;
                             padding-bottom: 15px;     
                          }
                        card:
                          type: vertical-stack
                          cards:
                            - show_state: false
                              show_name: false
                              camera_view: live
                              type: picture-entity
                              entity: camera.highway
                            - type: entities
                              entities:
                                - entity: sensor.to_work
                                  name: To Work
                                - entity: sensor.to_home
                                  name: To Home
                                  icon: mdi:home
                              title: Work
                              state_color: false
                icon: mdi:briefcase
                layout: vertical
                icon_color: orange
              - type: custom:mushroom-template-card
                entity: binary_sensor.mmw_bedroom
                tap_action:
                  action: navigate
                  navigation_path: /config/devices/device/b3c8d12bc32442880c459cd8fc39578b
                primary: Bedroom
                secondary: >-
                  {{ relative_time(
                  states.binary_sensor.mmw_bedroom.last_changed ) }}
                icon: mdi:motion-sensor
                fill_container: false
                icon_color: |-
                  {% set state=states('binary_sensor.mmw_bedroom') %}
                  {% if state=='off' %}
                  green
                  {% elif state=='on' %}
                  red
                  {% endif %}
                layout: vertical
                name: Bedroom
              - type: custom:mushroom-template-card
                primary: Bathroom
                tap_action:
                  action: navigate
                  navigation_path: /config/devices/device/e9964c9724bcb1a7141938c0335b1549
                secondary: >-
                  {{ relative_time(
                  states.binary_sensor.bathroom_motion_presence.last_changed )
                  }}
                entity: binary_sensor.bathroom_motion_presence
                icon: mdi:motion-sensor
                icon_color: >-
                  {% set state=states('binary_sensor.bathroom_motion_presence')
                  %}

                  {% if state=='off' %}

                  green

                  {% elif state=='on' %}

                  red

                  {% endif %}
                layout: vertical
                name: Bathroom
              - type: custom:mushroom-template-card
                entity: binary_sensor.kids_bath_moving
                primary: Kids Bath
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/music
                hold_action:
                  action: navigate
                  navigation_path: /config/devices/device/f5bbb6cece7547dc6374a05417ca3c6d
                secondary: >-
                  {{ relative_time(
                  states.binary_sensor.kids_bath_moving.last_changed ) }}
                icon: mdi:motion-sensor
                icon_color: |-
                  {% set state=states('binary_sensor.kids_bath_moving') %}
                  {% if state=='off' %}
                  green
                  {% elif state=='on' %}
                  red
                  {% endif %}
                layout: vertical
                fill_container: true
                name: Kids Bath
              - type: custom:mushroom-template-card
                entity: binary_sensor.garage_two_motion
                tap_action:
                  action: fire-dom-event
                  browser_mod:
                    service: browser_mod.popup
                    data:
                      style: |
                        --popup-background-color: black;
                        --popup-border-color: transparent;
                      title: Garage
                      content:
                        type: custom:mod-card
                        style: |
                          ha-card {
                             padding-right: 15px;
                             padding-left: 15px;
                             padding-bottom: 15px;     
                          }
                        card:
                          type: vertical-stack
                          cards:
                            - show_state: false
                              show_name: false
                              camera_view: live
                              type: picture-entity
                              entity: camera.garage
                            - type: horizontal-stack
                              cards:
                                - type: custom:button-card
                                  label: Garage Door
                                  styles:
                                    card:
                                      - height: 150px
                                    grid:
                                      - grid-template-areas: '"l" "i" "s" "n"'
                                      - grid-template-rows: min-content 1fr min-content min-content
                                      - grid-template-columns: 1fr
                                  entity: cover.garage_door
                                  tap_action:
                                    action: none
                                  hold_action:
                                    action: call-service
                                    service: switch.turn_on
                                    service_data:
                                      entity_id: switch.garage_door
                                  show_state: true
                                  show_label: true
                                  size: 40%
                                  state:
                                    - color: green
                                      icon: mdi:garage-variant
                                      value: closed
                                      state: CLOSED
                                      name: (Hold to Open)
                                    - color: red
                                      icon: mdi:garage-open-variant
                                      value: open
                                      name: (Hold to Close)
                primary: Garage
                secondary: >-
                  {{ relative_time(
                  states.binary_sensor.garage_two_motion.last_changed ) }}
                icon: mdi:motion-sensor
                fill_container: true
                icon_color: |-
                  {% set state=states('binary_sensor.garage_two_motion') %}
                  {% if state=='off' %}
                  green
                  {% elif state=='on' %}
                  red
                  {% endif %}
                layout: vertical
                name: Garage
            view_layout:
              column: 1
          - show_state: false
            show_name: false
            camera_view: auto
            type: picture-entity
            image: /api/image/serve/5edabea63241ac80692eb0f49f88e7b9/512x512
            entity: sensor.rain_gauge_battery
            visibility:
              - condition: state
                entity: calendar.rubbish
                state: 'on'
            layout_options:
              grid_columns: 4
              grid_rows: 3
          - show_state: false
            show_name: false
            camera_view: auto
            type: picture-entity
            entity: sensor.rain_gauge_battery
            visibility:
              - condition: state
                entity: calendar.rubbish_recycle
                state: 'on'
            layout_options:
              grid_columns: 4
              grid_rows: 3
            image: /api/image/serve/9e45d063d9186d86a0257ea7a1c95e52/512x512
          - type: custom:auto-entities
            card:
              type: entities
              show_header_toggle: false
              state_color: false
            filter:
              include:
                - group: group.switches
                  state: 'on'
                  options:
                    secondary_info: last-changed
                - group: group.every_light
                  state: 'on'
                  options:
                    secondary_info: last-changed
                - group: group.vacuum
                  state: cleaning
                  options:
                    secondary_info: last-changed
              exclude: []
            show_empty: false
            sort:
              method: last_changed
            style: |
              ha-card {
                box-shadow: none;
                border: none;
                margin: 0;
              }
              ha-markdown.no-header {
                box-shadow: none;
                padding: 0 0 0 16px;
                border: none;
                margin: 0;
              }
          - type: custom:bubble-card
            card_type: pop-up
            hash: '#garage'
            button_type: state
            entity: cover.garage_door
            name: Garage Door
      - type: grid
        cards:
          - square: false
            type: grid
            cards:
              - card: null
                image: /local/empty_frame.png
                elements:
                  - style:
                      top: 50%
                      left: 50%
                      width: 70%
                    type: image
                    entity: binary_sensor.dad_presence
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.popup
                        data:
                          style: |
                            --popup-background-color: black;
                            --popup-border-color: transparent;
                          title: Shayno
                          content:
                            type: custom:mod-card
                            style: |
                              ha-card {
                                 padding-right: 15px;
                                 padding-left: 15px;
                                 padding-bottom: 15px;     
                              }
                            card:
                              type: vertical-stack
                              cards:
                                - type: horizontal-stack
                                  cards:
                                    - type: map
                                      hours_to_show: 24
                                      entities:
                                        - entity: device_tracker.dad_gps
                                        - entity: device_tracker.ethans_iphone
                                        - entity: device_tracker.ella_iphone
                                        - entity: zone.home
                                        - entity: zone.park
                                        - entity: zone.dads_work
                                        - entity: zone.nic_s_house
                                        - entity: zone.kids_school
                                        - entity: zone.e_work
                                        - entity: zone.jacksons
                                        - entity: zone.westfield
                                        - entity: zone.ethan_work
                                        - entity: zone.gym
                                      aspect_ratio: '1'
                                      use_entity_picture: true
                    state_image:
                      'on': /local/shayno1.png
                      'off': /local/shayno1_away.png
                  - style:
                      top: 11%
                      left: 12%
                    type: state-icon
                    entity: sensor.dad_wifi
                  - style:
                      top: 90%
                      left: 12%
                    type: state-icon
                    entity: device_tracker.dad_bt
                  - style:
                      top: 11%
                      left: 87%
                    type: state-label
                    entity: sensor.dad_battery
                  - style:
                      top: 95%
                      left: 50%
                    type: state-label
                    entity: sensor.dad_distance
                  - style:
                      top: 10%
                      left: 50%
                    type: state-label
                    entity: device_tracker.dad_gps
                type: picture-elements
              - card: null
                image: /local/empty_frame.png
                elements:
                  - style:
                      top: 50%
                      left: 50%
                      width: 70%
                    type: image
                    entity: device_tracker.ethans_iphone
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.popup
                        data:
                          style: |
                            --popup-background-color: black;
                            --popup-border-color: transparent;
                          title: Ethan
                          content:
                            type: custom:mod-card
                            style: |
                              ha-card {
                                 padding-right: 15px;
                                 padding-left: 15px;
                                 padding-bottom: 15px;     
                              }
                            card:
                              type: vertical-stack
                              cards:
                                - type: custom:mushroom-entity-card
                                  entity: sensor.ethans_iphone_geocoded_location
                                  primary_info: none
                                  icon: mdi:map-marker
                                  icon_color: yellow
                                - type: horizontal-stack
                                  cards:
                                    - type: map
                                      hours_to_show: 24
                                      entities:
                                        - entity: device_tracker.ethans_iphone
                                        - entity: zone.home
                                        - entity: zone.dads_work
                                        - entity: zone.nic_s_house
                                        - entity: zone.kids_school
                                        - entity: zone.school
                                      aspect_ratio: '1'
                                      use_entity_picture: true
                    state_image:
                      home: /local/ethan3.png
                      not_home: /local/ethan3away.png
                      Work: /local/ethanwork.png
                      Nicole's: /local/ethan3away.png
                      Westfield: /local/ethan3away.png
                      Emma's: /local/ethan3away.png
                  - style:
                      top: 11%
                      left: 12%
                    type: state-icon
                    entity: sensor.ethans_iphone_ssid
                  - style:
                      top: 90%
                      left: 12%
                    type: state-icon
                    entity: device_tracker.ethan_bt
                  - style:
                      top: 11%
                      left: 87%
                    type: state-label
                    entity: sensor.ethans_iphone_battery_level
                  - style:
                      top: 95%
                      left: 50%
                    type: state-label
                    entity: sensor.ethan_distance
                  - style:
                      top: 10%
                      left: 50%
                    type: state-label
                    entity: device_tracker.ethans_iphone
                type: picture-elements
              - card: null
                image: /local/empty_frame.png
                elements:
                  - style:
                      top: 50%
                      left: 50%
                      width: 70%
                    type: image
                    entity: binary_sensor.ella_presence
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.popup
                        data:
                          style: |
                            --popup-background-color: black;
                            --popup-border-color: transparent;
                          title: Ella
                          content:
                            type: custom:mod-card
                            style: |
                              ha-card {
                                 padding-right: 15px;
                                 padding-left: 15px;
                                 padding-bottom: 15px;     
                              }
                            card:
                              type: vertical-stack
                              cards:
                                - type: custom:mushroom-entity-card
                                  entity: sensor.ella_iphone_geocoded_location
                                  primary_info: none
                                  icon: mdi:map-marker
                                  icon_color: yellow
                                - type: horizontal-stack
                                  cards:
                                    - type: map
                                      hours_to_show: 24
                                      entities:
                                        - entity: device_tracker.ella_iphone
                                        - entity: zone.home
                                        - entity: zone.dads_work
                                        - entity: zone.nic_s_house
                                        - entity: zone.kids_school
                                        - entity: zone.jacksons
                                      aspect_ratio: '1'
                                      use_entity_picture: true
                    state_image:
                      'on': /local/ella6.png
                      'off': /local/ella5_away.png
                  - style:
                      top: 11%
                      left: 12%
                    type: state-icon
                    entity: sensor.ella_iphone_ssid
                  - style:
                      top: 90%
                      left: 12%
                    type: state-icon
                    entity: device_tracker.ella_bt
                  - style:
                      top: 11%
                      left: 87%
                    type: state-label
                    entity: sensor.ella_iphone_battery_level
                  - style:
                      top: 95%
                      left: 50%
                    type: state-label
                    entity: sensor.ella_distance
                  - style:
                      top: 10%
                      left: 50%
                    type: state-label
                    entity: device_tracker.ella_iphone
                type: picture-elements
          - type: custom:mushroom-template-card
            primary: The Gobbler King is {{ states('sensor.roborock_qrevo_status') }}
            secondary: >
              His Battery is at {{ states('sensor.roborock_qrevo_battery') }}%
              And{% if is_state('binary_sensor.roborock_qrevo_mop_drying', 'on')
              %} Mop is drying, remaining time: {{
              states('sensor.roborock_qrevo_mop_drying_remaining_time') }}min {%
              else %} The mop is dry {% endif %}
            icon: mdi:robot-vacuum
            icon_color: >
              {% if is_state('sensor.roborock_qrevo_status', 'charging') and
              states('sensor.roborock_qrevo_battery')|int < 100 %}
                red
              {% elif states('sensor.roborock_qrevo_battery')|int == 100 %}
                green
              {% else %}
                blue
              {% endif %}
            entity: vacuum.roborock_qrevo
            tap_action:
              action: more-info
            layout: horizontal
            multiline_secondary: true
            layout_options:
              grid_columns: 4
              grid_rows: auto
          - show_state: false
            show_name: false
            camera_view: live
            type: picture-entity
            entity: camera.garage
            visibility:
              - condition: state
                entity: cover.garage_door
                state: open
          - square: false
            type: grid
            cards:
              - type: custom:bubble-card
                card_type: button
                entity: cover.garage_door
                name: Garage
                styles: |-
                  .bubble-button-card-container {
                    background-color: ${state === 'closed' ? 'rgba(12,120,50,0.)' : 'rgba(122,9,1,0.7)'} !important;
                  }
                button_type: state
                show_last_changed: true
                button_action:
                  hold_action:
                    action: toggle
                    service: ''
                    target: {}
                card_layout: large-2-rows
                scrolling_effect: false
                icon: ''
                show_state: false
                double_tap_action:
                  action: more-info
              - type: custom:bubble-card
                card_type: button
                entity: light.tv
                show_last_changed: true
                show_state: false
                card_layout: large
                hold_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.tv_tv_use
                scrolling_effect: false
              - type: custom:bubble-card
                card_type: button
                entity: light.bathroom
                name: Bathroom
                show_last_changed: true
                icon: mdi:shower-head
                card_layout: large
                scrolling_effect: false
              - type: custom:bubble-card
                card_type: button
                entity: light.bedhead
                show_attribute: false
                show_last_changed: true
                show_state: false
                card_layout: large
                scrolling_effect: false
              - type: custom:bubble-card
                card_type: button
                entity: light.bedroom_lamps
                name: Bed Lamps
                show_last_changed: true
                card_layout: large
                scrolling_effect: false
              - type: custom:bubble-card
                card_type: button
                entity: light.living_room
                name: Living Room
                show_last_changed: true
                card_layout: large
                icon: mdi:floor-lamp-torchiere
                scrolling_effect: false
              - type: custom:bubble-card
                card_type: button
                entity: light.ella_s_room
                show_last_changed: true
                icon: mdi:lamp
                card_layout: large
                scrolling_effect: false
              - type: custom:bubble-card
                card_type: button
                entity: light.ethan_s_room
                show_state: false
                show_last_changed: true
                icon: mdi:lamp
                card_layout: large
                scrolling_effect: false
              - type: custom:bubble-card
                card_type: button
                entity: light.hue_group
                show_last_changed: true
                name: Ambient Lights
                card_layout: large
                scrolling_effect: false
              - type: custom:bubble-card
                card_type: button
                entity: light.kids_bathroom_light
                icon: mdi:shower-head
                show_last_changed: true
                card_layout: large
                scrolling_effect: false
              - type: custom:mushroom-fan-card
                entity: fan.bedroom_fan
                icon_animation: true
                fill_container: false
                style: |
                  mushroom-shape-icon{
                    --icon-color: rgb(var(--rgb-light-blue)) !important;
                     --shape-color: rgba(var(--rgb-light-blue), 0.2) !important;
                   }
              - type: custom:mushroom-fan-card
                entity: input_boolean.air_con
                icon_animation: true
                icon: mdi:fan
                fill_container: false
                style: |
                  mushroom-shape-icon{
                    --icon-color: rgb(var(--rgb-light-blue)) !important;
                     --shape-color: rgba(var(--rgb-light-blue), 0.2) !important;
                   }
            columns: 2
      - type: grid
        cards:
          - show_state: false
            show_name: false
            camera_view: live
            type: picture-entity
            entity: image.roborock_qrevo
            visibility:
              - condition: state
                entity: vacuum.roborock_qrevo
                state: cleaning
          - square: false
            type: grid
            cards:
              - type: gauge
                entity: sensor.ubuntu_cpu_usage
                needle: false
                severity:
                  green: 0
                  yellow: 60
                  red: 80
              - type: gauge
                entity: sensor.ubuntu_memory_usage
                severity:
                  green: 0
                  yellow: 60
                  red: 80
              - type: gauge
                entity: sensor.ubuntu_cpu_temperature
                severity:
                  green: 0
                  yellow: 70
                  red: 80
            columns: 3
          - type: custom:mushroom-template-card
            primary: >+
              There {% if states('sensor.plex_shayflix') | int == 0 or
              states('sensor.plex_shayflix') | int > 1 %} are {{
              states('sensor.plex_shayflix') }} people {% elif
              states('sensor.plex_shayflix') | int == 1 %} is 1 person {% endif
              %} watching Plex.

            secondary: |-

              Top Monthly TV Show = {{ states('sensor.tautulli_top_tv_show') }}
              Top Monthly Movie = {{ states('sensor.tautulli_top_movie') }}
            icon: mdi:plex
            icon_color: orange
            picture: /local/plex1.png
            fill_container: true
            multiline_secondary: true
            layout: horizontal
            view_layout:
              column: 3
          - square: false
            type: grid
            cards:
              - type: custom:state-switch
                entity: sensor.bergasha_state
                states:
                  playing:
                    type: custom:mushroom-template-card
                    primary: Shayno is watching...
                    secondary: >
                      {{ states('sensor.bergasha_full_title') }}

                      Progress {{ states('sensor.bergasha_progress') }}% - {{
                      states('sensor.bergasha_video_resolution') }} - {{
                      states('sensor.bergasha_transcode_decision') }} - {{
                      states('sensor.bergasha_stream_resolution') }}
                    multiline_secondary: true
                    icon: mdi:play
                    icon_color: orange
                  paused:
                    type: custom:mushroom-template-card
                    primary: Shayno is watching...
                    secondary: >
                      {{ states('sensor.bergasha_full_title') }}

                      Progress {{ states('sensor.bergasha_progress') }}% - {{
                      states('sensor.bergasha_video_resolution') }} - {{
                      states('sensor.bergasha_transcode_decision') }} - {{
                      states('sensor.bergasha_stream_resolution') }}
                    multiline_secondary: true
                    icon: mdi:pause
                    icon_color: red
              - type: custom:state-switch
                entity: sensor.kahrag_state
                states:
                  playing:
                    type: custom:mushroom-template-card
                    primary: Kahrag is watching...
                    secondary: >
                      {{ states('sensor.kahrag_full_title') }}

                      Progress {{ states('sensor.kahrag_progress') }}% - {{
                      states('sensor.kahrag_video_resolution') }} - {{
                      states('sensor.kahrag_transcode_decision') }} - {{
                      states('sensor.kahrag_stream_resolution') }}
                    multiline_secondary: true
                    icon: mdi:play
                    icon_color: orange
                  paused:
                    type: custom:mushroom-template-card
                    primary: Kahrag is watching...
                    secondary: >
                      {{ states('sensor.kahrag_full_title') }}

                      Progress {{ states('sensor.kahrag_progress') }}% - {{
                      states('sensor.kahrag_video_resolution') }} - {{
                      states('sensor.kahrag_transcode_decision') }} - {{
                      states('sensor.kahrag_stream_resolution') }}
                    multiline_secondary: true
                    icon: mdi:pause
                    icon_color: red
              - type: custom:state-switch
                entity: sensor.bergodavo_state
                states:
